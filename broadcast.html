<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broadcast | Signal Room</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app">
  <header class="topbar">
    <a class="brand-mark" style="margin-bottom: 0;" href="index.html"><span></span> Signal Room</a>
    <nav><a class="active"  href="broadcast.html">Broadcast</a><a href="view.html" target="_blank">Viewer</a>
      <!-- <a class="nav-live" href="view.html">● Live</a> -->
    </nav>
  </header>
  <main class="app-main">
    <div class="app-heading">
      <h1>Broadcast</h1>
      <div class="channel-label">Channel: <strong id="channel-readout">live</strong></div>
    </div>
    <section class="broadcast-grid">
      <div class="stage" id="broadcast-stage">
        <video id="preview" autoplay muted playsinline controls></video>
        <div class="stage-empty" id="stage-empty"><div class="stage-empty-inner"><h2>Preview standby</h2><p>Allow camera access, then start.</p></div></div>
      </div>
      <aside class="control-panel">
        <h2 class="panel-title">Setup</h2>
        <label class="input-label" for="channel">Channel ID</label>
        <input class="text-input" id="channel" value="live" maxlength="40" autocomplete="off">
        <div class="panel-spacer"></div>
        <div class="control-row"><button class="control-button" id="start-button">Start</button><button class="control-button secondary" id="pause-button" disabled>Pause</button></div>
        <button class="control-button secondary" id="stop-button" disabled style="margin-top:12px">Stop</button>
        <p class="helper" id="broadcast-status">Camera remains local until started.</p>
      </aside>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>SignalRoom.initBroadcast();</script>
</body>
</html>
