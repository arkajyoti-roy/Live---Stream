<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch | Signal Room</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app">
  <header class="topbar">
    <a class="brand-mark" style="margin-bottom: 0;" href="index.html"><span></span> Signal Room</a>
    <nav><a href="broadcast.html">Broadcast</a><a class="active" href="view.html">Viewer</a>
    </nav>
  </header>
  <main class="app-main">
    <div class="app-heading">
      <h1>Watch live</h1>
      <div class="channel-label">Channel: <strong id="viewer-channel">live</strong></div>
    </div>
    <section class="viewer-layout">
      <div>
        <div class="viewer-stage">
          <video class="viewer-video" id="viewer-video" autoplay playsinline controls></video>
          <div class="stage-empty" id="viewer-empty"><div class="stage-empty-inner"><h2>Waiting for broadcast</h2><p id="viewer-status">Connecting to channel.</p></div></div>
        </div>
        <div class="viewer-info"><div><h2>Signal Room</h2><p>Live broadcast channel</p></div></div>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>SignalRoom.initViewer();</script>
</body>
</html>
